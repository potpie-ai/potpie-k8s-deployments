apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcore-auth-role-binding
  namespace: neo4j-db
subjects:
- kind: ServiceAccount
  name: mcore-auth-role
  namespace: neo4j-db  # Ensure this matches the namespace of the ServiceAccount
roleRef:
  kind: Role
  name: neo4j-role
  apiGroup: rbac.authorization.k8s.io
