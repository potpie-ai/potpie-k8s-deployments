apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: potpie-hpa
  namespace: potpie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: potpie-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80  # Target 50% CPU utilization
