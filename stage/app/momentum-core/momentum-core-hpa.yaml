apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: momentum-core-hpa
  namespace: app  # Ensure this matches your deployment's namespace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: momentum-core-deployment
  minReplicas: 1           # Minimum number of replicas
  maxReplicas: 10         # Maximum number of replicas (adjust as necessary)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80  # Target CPU utilization percentage
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80       
