apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: conversation-server-hpa
  namespace: devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: conversation-server-deployment
  minReplicas: 1
  maxReplicas: 25
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70   
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70  
