apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-certificate-secret
  namespace: monitoring
spec:
  secretName: monitoring-certificate-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: grafana.potpie.ai
  dnsNames:
  - grafana.potpie.ai
 
  