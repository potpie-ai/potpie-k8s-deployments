apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-unsealer-full-access
subjects:
- kind: ServiceAccount
  name: vault-unsealer-sa
  namespace: mom-vault  # Make sure this matches the service account's namespace
roleRef:
  kind: ClusterRole
  name: full-access      # Reference the ClusterRole created in Step 1
  apiGroup: rbac.authorization.k8s.io
