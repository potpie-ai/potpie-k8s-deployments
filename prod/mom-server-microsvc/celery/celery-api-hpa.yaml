apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-api-hpa
  namespace: micro-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-api-deployment
  minReplicas: 1
  maxReplicas: 25
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80  # Target 50% CPU utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Target 50% CPU utilization
