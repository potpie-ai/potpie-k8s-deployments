---
# Source: neo4j/templates/neo4j-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    helm.neo4j.com/neo4j.name: "neo4j-db"
    helm.neo4j.com/clustering: "false"
    app: "neo4j-db"
    helm.neo4j.com/instance: neo4j-enterprise    
  name: neo4j-enterprise
  namespace: "neo4j-db"
spec:
  serviceName: "neo4j-enterprise"
  podManagementPolicy: "Parallel" # This setting means that the StatefulSet controller doesn't block applying changes until the existing Pod is READY.
  replicas: 3
  selector:
    matchLabels:
      app: "neo4j-db"
      helm.neo4j.com/instance: "neo4j-enterprise"
  template:
    metadata:
      labels:
        app: "neo4j-db"
        helm.neo4j.com/neo4j.name: "neo4j-db"
        helm.neo4j.com/clustering: "false"
        helm.neo4j.com/pod_category: "neo4j-instance" # used for anti affinity rules
        helm.neo4j.com/neo4j.loadbalancer: "include"
        helm.neo4j.com/instance: "neo4j-enterprise"        
      annotations:
        "checksum/neo4j-enterprise-config": dad6aac290ba2d69ff0ba7773809e233824244bff9e72bb60691927c03362d5a
        "checksum/neo4j-enterprise-env": 4e4d3363b747126842c587cc2659326a197a8bd9af2e000f3e6ce376f8b6000e        
    spec:      
      affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: "neo4j-db"
                    helm.neo4j.com/pod_category: "neo4j-instance"
                topologyKey: kubernetes.io/hostname
      dnsPolicy: ClusterFirst
      securityContext: 
        fsGroup: 7474
        fsGroupChangePolicy: Always
        runAsGroup: 7474
        runAsNonRoot: true
        runAsUser: 7474            
      
      terminationGracePeriodSeconds: 3600            
      containers:
        - name: "neo4j"
          image: "neo4j:5.23-enterprise"
          imagePullPolicy: "IfNotPresent"
          envFrom:
            - configMapRef:
                name: "neo4j-enterprise-env"
          env:
            - name: HELM_NEO4J_VERSION
              value: "5.23"
            - name: HELM_CHART_VERSION
              value: "5.23"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_NEO4J_ADMIN
              value: "neo4j-enterprise-admin.neo4j-db.svc.cluster.local"
            - name: SERVICE_NEO4J_INTERNALS
              value: "neo4j-enterprise-internals.neo4j-db.svc.cluster.local"
            - name: SERVICE_NEO4J
              value: "neo4j-enterprise.neo4j-db.svc.cluster.local"
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
            - containerPort: 6362
              name: backup
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 1000m
              memory: 1Gi
          securityContext: 
              capabilities:
                drop:
                - ALL
              runAsGroup: 7474
              runAsNonRoot: true
              runAsUser: 7474
          volumeMounts:
            - mountPath: "/config/neo4j.conf"
              name: neo4j-conf
            - mountPath: "/config/server-logs.xml"
              name: neo4j-server-logs
            - mountPath: "/config/user-logs.xml"
              name: neo4j-user-logs
            - mountPath: "/config/neo4j-auth"
              name: neo4j-auth
                                                            
            - mountPath: "/backups"
              name: "data"
              subPathExpr: "backups"
            - mountPath: "/data"
              name: "data"
              subPathExpr: "data"
            - mountPath: "/import"
              name: "data"
              subPathExpr: "import"
            - mountPath: "/licenses"
              name: "data"
              subPathExpr: "licenses"
            - mountPath: "/logs"
              name: "data"
              subPathExpr: "logs/$(POD_NAME)"
            - mountPath: "/metrics"
              name: "data"
              subPathExpr: "metrics/$(POD_NAME)"            
          readinessProbe:
            tcpSocket:
              port: 7687
            failureThreshold: 20
            timeoutSeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 7687
            failureThreshold: 40
            timeoutSeconds: 10
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: 7687
            failureThreshold: 1000
            periodSeconds: 5
      volumes:
        - name: neo4j-conf
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: "neo4j-enterprise-default-config"
              - configMap:
                  name: "neo4j-enterprise-user-config"
              - configMap:
                  name: "neo4j-enterprise-k8s-config"
        - name: neo4j-server-logs
          configMap:
            name: "neo4j-enterprise-server-logs-config"
        - name: neo4j-user-logs
          configMap:
            name: "neo4j-enterprise-user-logs-config"
        - name: "neo4j-auth"
          secret:
            secretName: "neo4j-db-auth"                                
        - name: "data"
          persistentVolumeClaim:
            claimName: neo4j-pvc
